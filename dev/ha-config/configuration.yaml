# Dev-only Home Assistant config. Everything else in this directory is
# generated by the container and gitignored.
#
# The timezone must match the Mac's, otherwise due-date round trips shift by
# the offset and the tests get confusing. Keep in sync with docker-compose.yml.
homeassistant:
  name: Reminders Sync Dev
  time_zone: Europe/Warsaw
  unit_system: metric
  currency: EUR
  country: PL

default_config:

# The sync script talks to /api/services/todo/*, which needs nothing beyond
# `http` + a long-lived token. `default_config` already pulls in the rest.
http:
  server_port: 8123
